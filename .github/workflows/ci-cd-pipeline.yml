name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Decide which backend(s) changed so each build job only runs when relevant.
  changes:
    runs-on: ubuntu-latest
    outputs:
      weatheruseractions: ${{ steps.filter.outputs.weatheruseractions }}
      predictionupdater: ${{ steps.filter.outputs.predictionupdater }}
      weatherappuserinterface: ${{ steps.filter.outputs.weatherappuserinterface }}
      mssql: ${{ steps.filter.outputs.mssql }}
      ingress: ${{ steps.filter.outputs.ingress }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            weatheruseractions:
              - 'backend/WeatherUserActions/**'
              - 'Deployment/weatheruseractions/**'
              - '.github/workflows/ci-cd-pipeline.yml'
            predictionupdater:
              - 'backend/PredictionUpdater/**'
              - 'Deployment/predictionupdater/**'
              - '.github/workflows/ci-cd-pipeline.yml'
            weatherappuserinterface:
              - 'frontend/WeatherAppUserInterface/**'
              - 'Deployment/weatherappuserinterface/**'
              - '.github/workflows/ci-cd-pipeline.yml'
            mssql:
              - 'Deployment/namespace.yaml'
              - 'Deployment/mssql/**'
              - '.github/workflows/ci-cd-pipeline.yml'
            ingress:
              - 'Deployment/ingress/**'
              - '.github/workflows/ci-cd-pipeline.yml'

  weatheruseractions:
    needs: changes
    if: ${{ needs.changes.outputs.weatheruseractions == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/WeatherUserActions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore WeatherUserActions.slnx

      - name: Build
        run: dotnet build WeatherUserActions.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test WeatherUserActions.slnx --no-build --configuration Release

  # CD: build the image, push it to Docker Hub, deploy to DigitalOcean Kubernetes.
  # Only on push to main, and only after the CI job above passed.
  deploy-weatheruseractions:
    needs: weatheruseractions
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    concurrency: deploy-weatheruseractions
    env:
      # One private Docker Hub repo holds every app; the tag says which app + which commit.
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/weather-forecasts:weatheruseractions-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The GitHub Actions cache keeps unchanged layers (e.g. NuGet restore) between runs.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend/WeatherUserActions
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=weatheruseractions
          cache-to: type=gha,mode=max,scope=weatheruseractions

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Connect kubectl to the cluster
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 ${{ secrets.DOKS_CLUSTER_NAME }}

      # The image is private, so the cluster needs a Docker Hub login to pull it.
      - name: Create Docker Hub pull Secret
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          kubectl create secret docker-registry dockerhub-secret \
            --namespace weather \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="$DOCKERHUB_USERNAME" \
            --docker-password="$DOCKERHUB_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create app Secret
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          kubectl create secret generic weatheruseractions-secret \
            --namespace weather \
            --from-literal=APPWRITE_ENDPOINT="$APPWRITE_ENDPOINT" \
            --from-literal=APPWRITE_PROJECT_ID="$APPWRITE_PROJECT_ID" \
            --from-literal=APPWRITE_API_KEY="$APPWRITE_API_KEY" \
            --from-literal=EMAIL_HOST="$EMAIL_HOST" \
            --from-literal=EMAIL_FROM="$EMAIL_FROM" \
            --from-literal=EMAIL_USERNAME="$EMAIL_USERNAME" \
            --from-literal=EMAIL_PASSWORD="$EMAIL_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Swap IMAGE_PLACEHOLDER for the tag just pushed, then apply.
      - name: Apply manifests
        run: |
          sed "s|IMAGE_PLACEHOLDER|$IMAGE|g" Deployment/weatheruseractions/weatheruseractions-deployment.yaml \
            | kubectl apply -f -
          kubectl apply -f Deployment/weatheruseractions/weatheruseractions-service.yaml

      # Covers the migrate init container too: a failed migration fails this step.
      - name: Wait for rollout
        run: kubectl rollout status deployment/weatheruseractions --namespace weather --timeout=10m

  predictionupdater:
    needs: changes
    if: ${{ needs.changes.outputs.predictionupdater == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/PredictionUpdater

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/PredictionUpdater/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # CD: build the image, push it to Docker Hub, update the CronJob on DigitalOcean Kubernetes.
  # Only on push to main, and only after the CI job above passed. Nothing runs right away:
  # the next schedule tick starts a pod with the new image.
  deploy-predictionupdater:
    needs: predictionupdater
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    concurrency: deploy-predictionupdater
    env:
      # One private Docker Hub repo holds every app; the tag says which app + which commit.
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/weather-forecasts:predictionupdater-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend/PredictionUpdater
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=predictionupdater
          cache-to: type=gha,mode=max,scope=predictionupdater

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Connect kubectl to the cluster
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 ${{ secrets.DOKS_CLUSTER_NAME }}

      # The image is private, so the cluster needs a Docker Hub login to pull it.
      - name: Create Docker Hub pull Secret
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          kubectl create secret docker-registry dockerhub-secret \
            --namespace weather \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="$DOCKERHUB_USERNAME" \
            --docker-password="$DOCKERHUB_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Keys are named after the env vars the job reads (the CronJob loads them with envFrom).
      # A GitHub secret that isn't set is left out: the job's config treats a missing key as
      # "feature off", but an empty string as invalid.
      - name: Create app Secret
        env:
          YOUR_APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          YOUR_APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          YOUR_APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          SMTP_HOST: ${{ secrets.EMAIL_HOST }}
          SMTP_USER: ${{ secrets.EMAIL_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
          WEATHERAPI_API_KEY: ${{ secrets.WEATHERAPI_API_KEY }}
          VISUALCROSSING_API_KEY: ${{ secrets.VISUALCROSSING_API_KEY }}
        run: |
          args=()
          for name in YOUR_APPWRITE_ENDPOINT YOUR_APPWRITE_PROJECT_ID YOUR_APPWRITE_API_KEY \
                      SMTP_HOST SMTP_USER SMTP_PASSWORD EMAIL_FROM \
                      OPENWEATHERMAP_API_KEY WEATHERAPI_API_KEY VISUALCROSSING_API_KEY; do
            if [ -n "${!name}" ]; then
              args+=(--from-literal="$name=${!name}")
            else
              echo "Skipping $name (GitHub secret not set)"
            fi
          done
          kubectl create secret generic predictionupdater-secret \
            --namespace weather \
            "${args[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Swap IMAGE_PLACEHOLDER for the tag just pushed, then apply.
      - name: Apply CronJob
        run: |
          sed "s|IMAGE_PLACEHOLDER|$IMAGE|g" Deployment/predictionupdater/predictionupdater-cronjob.yaml \
            | kubectl apply -f -

  weatherappuserinterface:
    needs: changes
    if: ${{ needs.changes.outputs.weatherappuserinterface == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/WeatherAppUserInterface

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/WeatherAppUserInterface/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # CD: build the image, push it to Docker Hub, deploy to DigitalOcean Kubernetes.
  # Only on push to main, and only after the CI job above passed.
  deploy-weatherappuserinterface:
    needs: weatherappuserinterface
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    concurrency: deploy-weatherappuserinterface
    env:
      # One private Docker Hub repo holds every app; the tag says which app + which commit.
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/weather-forecasts:weatherappuserinterface-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Vite bakes these into the JS at build time. They are public (every browser sees them),
      # so passing them as build args is fine.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: frontend/WeatherAppUserInterface
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            YOUR_APPWRITE_ENDPOINT=${{ secrets.APPWRITE_ENDPOINT }}
            YOUR_APPWRITE_PROJECT_ID=${{ secrets.APPWRITE_PROJECT_ID }}
          cache-from: type=gha,scope=weatherappuserinterface
          cache-to: type=gha,mode=max,scope=weatherappuserinterface

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Connect kubectl to the cluster
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 ${{ secrets.DOKS_CLUSTER_NAME }}

      # The image is private, so the cluster needs a Docker Hub login to pull it.
      - name: Create Docker Hub pull Secret
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          kubectl create secret docker-registry dockerhub-secret \
            --namespace weather \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="$DOCKERHUB_USERNAME" \
            --docker-password="$DOCKERHUB_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Swap IMAGE_PLACEHOLDER for the tag just pushed, then apply.
      - name: Apply manifests
        run: |
          sed "s|IMAGE_PLACEHOLDER|$IMAGE|g" Deployment/weatherappuserinterface/weatherappuserinterface-deployment.yaml \
            | kubectl apply -f -
          kubectl apply -f Deployment/weatherappuserinterface/weatherappuserinterface-service.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/weatherappuserinterface --namespace weather --timeout=5m

  # CD: deploys SQL Server to DigitalOcean Kubernetes. Only on push to main (PRs never deploy).
  # Internal-only: reachable by pods in the cluster via the ClusterIP Service. Port 1433 is never
  # exposed (the ingress-nginx controller in deploy-ingress is HTTP only).
  deploy-mssql:
    needs: changes
    if: ${{ github.event_name == 'push' && needs.changes.outputs.mssql == 'true' }}
    runs-on: ubuntu-latest
    # Never run two mssql deploys at once; a newer push waits for the running one to finish.
    concurrency: deploy-mssql

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Connect kubectl to the cluster
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 ${{ secrets.DOKS_CLUSTER_NAME }}

      - name: Create namespace
        run: kubectl apply -f Deployment/namespace.yaml

      # mssql-secret.yaml is git-ignored, so the Secret is built from a GitHub secret instead.
      # `--dry-run=client -o yaml | kubectl apply` creates it the first time and updates it after.
      - name: Create SA password Secret
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        run: |
          kubectl create secret generic mssql-secret \
            --namespace weather \
            --from-literal=MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply SQL Server manifests
        run: |
          kubectl apply -f Deployment/mssql/mssql-pvc.yaml
          kubectl apply -f Deployment/mssql/mssql-service.yaml
          kubectl apply -f Deployment/mssql/mssql-statefulset.yaml

      - name: Wait for SQL Server to be ready
        run: kubectl rollout status statefulset/mssql --namespace weather --timeout=5m

  # CD: the public entry point. Installs/upgrades the ingress-nginx controller (creates the
  # DigitalOcean Load Balancer on first install) and applies the routing rules
  # (/api -> WeatherUserActions, / -> frontend). HTTP only; SQL Server stays internal.
  deploy-ingress:
    needs: changes
    if: ${{ github.event_name == 'push' && needs.changes.outputs.ingress == 'true' }}
    runs-on: ubuntu-latest
    concurrency: deploy-ingress

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Connect kubectl to the cluster
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 ${{ secrets.DOKS_CLUSTER_NAME }}

      # --wait: the controller must be ready before the Ingress below is applied (its admission
      # webhook validates every Ingress).
      - name: Install/upgrade ingress-nginx controller
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx --create-namespace \
            -f Deployment/ingress/ingress-nginx-values.yaml \
            --wait --timeout 10m

      - name: Create namespace
        run: kubectl apply -f Deployment/namespace.yaml

      - name: Apply Ingress
        run: kubectl apply -f Deployment/ingress/weather-ingress.yaml

      - name: Show public address
        run: kubectl get service ingress-nginx-controller --namespace ingress-nginx
