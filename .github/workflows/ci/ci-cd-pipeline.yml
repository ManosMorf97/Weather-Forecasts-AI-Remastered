name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Decide which backend(s) changed so each build job only runs when relevant.
  changes:
    runs-on: ubuntu-latest
    outputs:
      weatheruseractions: ${{ steps.filter.outputs.weatheruseractions }}
      predictionupdater: ${{ steps.filter.outputs.predictionupdater }}
      weatherappuserinterface: ${{ steps.filter.outputs.weatherappuserinterface }}
      mssql: ${{ steps.filter.outputs.mssql }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            weatheruseractions:
              - 'backend/WeatherUserActions/**'
              - '.github/workflows/ci-cd-pipeline.yml'
            predictionupdater:
              - 'backend/PredictionUpdater/**'
              - '.github/workflows/ci-cd-pipeline.yml'
            weatherappuserinterface:
              - 'frontend/WeatherAppUserInterface/**'
              - '.github/workflows/ci-cd-pipeline.yml'
            mssql:
              - 'Deployment/namespace.yaml'
              - 'Deployment/mssql/**'
              - '.github/workflows/ci-cd-pipeline.yml'

  weatheruseractions:
    needs: changes
    if: ${{ needs.changes.outputs.weatheruseractions == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/WeatherUserActions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore WeatherUserActions.slnx

      - name: Build
        run: dotnet build WeatherUserActions.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test WeatherUserActions.slnx --no-build --configuration Release

  predictionupdater:
    needs: changes
    if: ${{ needs.changes.outputs.predictionupdater == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/PredictionUpdater

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/PredictionUpdater/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  weatherappuserinterface:
    needs: changes
    if: ${{ needs.changes.outputs.weatherappuserinterface == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/WeatherAppUserInterface

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/WeatherAppUserInterface/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # CD: deploys SQL Server to DigitalOcean Kubernetes. Only on push to main (PRs never deploy).
  # Internal-only: reachable by pods in the cluster via the ClusterIP Service; ingress-nginx
  # (public 1433) is not installed here.
  deploy-mssql:
    needs: changes
    if: ${{ github.event_name == 'push' && needs.changes.outputs.mssql == 'true' }}
    runs-on: ubuntu-latest
    # Never run two mssql deploys at once; a newer push waits for the running one to finish.
    concurrency: deploy-mssql

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Connect kubectl to the cluster
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 ${{ secrets.DOKS_CLUSTER_NAME }}

      - name: Create namespace
        run: kubectl apply -f Deployment/namespace.yaml

      # mssql-secret.yaml is git-ignored, so the Secret is built from a GitHub secret instead.
      # `--dry-run=client -o yaml | kubectl apply` creates it the first time and updates it after.
      - name: Create SA password Secret
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        run: |
          kubectl create secret generic mssql-secret \
            --namespace weather \
            --from-literal=MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply SQL Server manifests
        run: |
          kubectl apply -f Deployment/mssql/mssql-pvc.yaml
          kubectl apply -f Deployment/mssql/mssql-service.yaml
          kubectl apply -f Deployment/mssql/mssql-statefulset.yaml

      - name: Wait for SQL Server to be ready
        run: kubectl rollout status statefulset/mssql --namespace weather --timeout=5m
