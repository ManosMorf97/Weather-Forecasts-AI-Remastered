name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/WeatherUserActions/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/WeatherUserActions/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/WeatherUserActions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore WeatherUserActions.slnx

      - name: Build
        run: dotnet build WeatherUserActions.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test WeatherUserActions.slnx --no-build --configuration Release
