# ClusterIP: reachable only inside the cluster. The public entry point is the Ingress
# (Deployment/ingress/weather-ingress.yaml), which routes / here.
apiVersion: v1
kind: Service
metadata:
  name: weatherappuserinterface
  namespace: weather
spec:
  type: ClusterIP
  selector:
    app: weatherappuserinterface
  ports:
    - name: http
      port: 80
      targetPort: http
