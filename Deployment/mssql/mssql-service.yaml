# ClusterIP: reachable only inside the cluster (e.g. WeatherUserActions / PredictionUpdater
# connect to mssql,1433). Not exposed to the internet. From your PC, use a temporary tunnel:
#   kubectl port-forward -n weather svc/mssql 1433:1433   ->  localhost,1433
apiVersion: v1
kind: Service
metadata:
  name: mssql
  namespace: weather
spec:
  type: ClusterIP
  selector:
    app: mssql
  ports:
    - name: sql
      port: 1433
      targetPort: sql
