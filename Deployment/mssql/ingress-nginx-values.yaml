# Helm values for the ingress-nginx chart on DigitalOcean (DOKS).
#
# A Kubernetes Ingress resource only understands HTTP/HTTPS, and SQL Server speaks raw TCP,
# so there is no Ingress object for it. ingress-nginx instead supports TCP passthrough: the
# `tcp` map below makes the chart (1) open port 1433 on the controller's Service, (2) create
# the tcp-services ConfigMap, and (3) start the controller with --tcp-services-configmap.
#
# On DOKS the controller's Service (type LoadBalancer) provisions a DigitalOcean Load Balancer,
# which is billed monthly. Port 1433 is added to that same load balancer.
#
# Format:  "<external port>": "<namespace>/<service>:<service port>"
tcp:
  "1433": "weather/mssql:1433"

controller:
  service:
    annotations:
      # SECURITY: this exposes SQL Server on the internet. Allow only your own IPs on the DO
      # load balancer's firewall. Set your real IP(s) before applying; comma-separated.
      service.beta.kubernetes.io/do-loadbalancer-allow-rules: "ip:203.0.113.10"
