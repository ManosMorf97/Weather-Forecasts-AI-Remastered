# Tells cert-manager where to get certificates: Let's Encrypt (free, 90-day certs, auto-renewed).
#
# Ownership check (HTTP-01): Let's Encrypt calls http://<domain>/.well-known/acme-challenge/...
# and cert-manager answers through a temporary Ingress on the nginx controller.
#
# No `email:` on purpose: Let's Encrypt no longer sends expiry emails, and cert-manager renews
# the certificate on its own ~30 days before it expires.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Secret where cert-manager keeps the Let's Encrypt account key (created automatically).
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
