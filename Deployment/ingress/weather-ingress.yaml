# One public address for the whole app, split by path:
#   https://weatherappmorf.duckdns.org/api/...  -> WeatherUserActions (every controller route starts with /api)
#   https://weatherappmorf.duckdns.org/...      -> frontend (React app)
# Same origin for both, so the browser never makes a cross-origin call: no CORS needed,
# YOUR_FRONTEND_URL and the frontend's YOUR_API_URL both stay empty.
#
# HTTPS: cert-manager (ClusterIssuer `letsencrypt`) gets the certificate for the host below and
# stores it in the `weather-tls` Secret. nginx redirects http:// to https:// automatically.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-ingress
  namespace: weather
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - weatherappmorf.duckdns.org
      secretName: weather-tls
  rules:
    - host: weatherappmorf.duckdns.org
      http:
        paths:
          # More specific path first for readability; nginx matches the longest prefix anyway.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: weatheruseractions
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weatherappuserinterface
                port:
                  name: http
