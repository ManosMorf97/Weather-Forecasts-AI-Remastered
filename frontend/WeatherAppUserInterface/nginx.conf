# Serves the built React app (dist/). /api is never seen here - the Ingress sends it to the backend.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # BrowserRouter: routes like /profile exist only in React, not as files. Unknown paths get
    # index.html so a page refresh or a shared link doesn't return 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts a content hash in asset file names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must always be re-checked, otherwise browsers keep pointing at old assets after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
